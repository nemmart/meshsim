<text x="24.0" y="34.0" font-size="18" text-anchor="start" font-weight="bold" fill="#444441">Figure 8. The split on the toy example, round by round</text>
<text x="24.0" y="56.0" font-size="12.5" text-anchor="start" font-weight="normal" fill="#6b6a64">Owner q looks for the key at which global rank 8q falls. The seed gives each owner a bracket from one sample per tile; then</text>
<text x="24.0" y="74.0" font-size="12.5" text-anchor="start" font-weight="normal" fill="#6b6a64">every round probes the bracket's midpoint, counts below and equal on every tile, and halves the bracket. Keys run 0–99.</text>
