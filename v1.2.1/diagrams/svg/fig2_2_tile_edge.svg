<text x="36.0" y="726.5" font-size="10.5" text-anchor="start" font-weight="bold" fill="#444441">error</text>
<rect x="170.0" y="712.0" width="160.0" height="21.0" rx="0" fill="white" stroke="#888780" stroke-width="0.8"/>
<text x="176.0" y="726.5" font-size="10.5" text-anchor="start" font-weight="normal" fill="#444441">each tile → C&amp;C</text>
<rect x="330.0" y="712.0" width="290.0" height="21.0" rx="0" fill="white" stroke="#888780" stroke-width="0.8"/>
<text x="336.0" y="726.5" font-size="10.5" text-anchor="start" font-weight="normal" fill="#444441">no equal-latency requirement</text>
<rect x="620.0" y="712.0" width="650.0" height="21.0" rx="0" fill="white" stroke="#888780" stroke-width="0.8"/>
