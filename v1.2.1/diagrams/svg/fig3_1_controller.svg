<text x="44.0" y="652.0" font-size="12" text-anchor="start" font-weight="bold" fill="#7F77DD">the control island (§12):</text>
<text x="44.0" y="668.0" font-size="12" text-anchor="start" font-weight="bold" fill="#7F77DD">≈ 0.09 mm², ≈ 0.3 mm across</text>
