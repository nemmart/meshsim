<rect x="170.0" y="733.0" width="160.0" height="21.0" rx="0" fill="white" stroke="#888780" stroke-width="0.8"/>
<text x="176.0" y="747.5" font-size="10.5" text-anchor="start" font-weight="normal" fill="#444441">tile 0 and C&amp;C, both ways</text>
<rect x="330.0" y="733.0" width="290.0" height="21.0" rx="0" fill="white" stroke="#888780" stroke-width="0.8"/>
<text x="336.0" y="747.5" font-size="10.5" text-anchor="start" font-weight="normal" fill="#444441">a router port (figure 4.3)</text>
<rect x="620.0" y="733.0" width="650.0" height="21.0" rx="0" fill="white" stroke="#888780" stroke-width="0.8"/>
<text x="626.0" y="747.5" font-size="10.5" text-anchor="start" font-weight="normal" fill="#444441">packets: C&amp;C's commands in; errors and results out</text>
<text x="30.0" y="780.0" font-size="11.5" text-anchor="start" font-weight="normal" fill="#444441">• In HALT done reads 1, so the boot marker (mode 6 to slot 0) raises READY at once (§6.2, figure 2.1 (a)). GO cannot arrive before the core is in WFI: it needs the READY round trip (§6.3). REPORT is a C&amp;C</text>
<text x="42.0" y="795.0" font-size="11.5" text-anchor="start" font-weight="normal" fill="#444441">and software protocol (§6.6), not drawn.</text>
<polyline points="30.0,828.0 70.0,828.0" fill="none" stroke="#D85A30" stroke-width="1.8" stroke-linejoin="round" stroke-dasharray="4 3" marker-end="url(#mD85A30)"/>
<text x="78.0" y="832.0" font-size="11.5" text-anchor="start" font-weight="normal" fill="#6b6a64">lines from C&amp;C</text>
<polyline points="186.1,828.0 226.1,828.0" fill="none" stroke="#1D9E75" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#m1D9E75)"/>
<text x="234.1" y="832.0" font-size="11.5" text-anchor="start" font-weight="normal" fill="#6b6a64">done, landed, READY</text>
<polyline points="370.1,828.0 410.1,828.0" fill="none" stroke="#C0392B" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#mC0392B)"/>
<text x="418.1" y="832.0" font-size="11.5" text-anchor="start" font-weight="normal" fill="#6b6a64">error</text>
<circle cx="480.03999999999996" cy="828" r="3.2" fill="#444441"/>
<text x="490.0" y="832.0" font-size="11.5" text-anchor="start" font-weight="normal" fill="#6b6a64">junction; wedge: clocked register</text>
<line x1="24" y1="848" x2="1276" y2="848" stroke="#B4B2A9" stroke-width="0.8"/>
<text x="24.0" y="870.0" font-size="12.5" text-anchor="start" font-weight="normal" fill="#444441">RUN's two edges come from one register: HALT → RUN resets the core and clears done and command landed; RUN → HALT clears the conditions.</text>
<text x="24.0" y="886.0" font-size="12.5" text-anchor="start" font-weight="normal" fill="#444441">READY is its own line, a one-cycle pulse when done and command landed are first both 1; done reads 1 throughout HALT. GO enters through go_q.</text>
<text x="24.0" y="902.0" font-size="12.5" text-anchor="start" font-weight="normal" fill="#444441">The error line is the OR of the tile's conditions.</text>
<text x="24.0" y="918.0" font-size="11" text-anchor="start" font-weight="normal" fill="#6b6a64" font-style="italic">Source: spec/machine-spec.md v1.0.</text>
