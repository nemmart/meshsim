<polyline points="334.0,684.0 334.0,448.0" fill="none" stroke="#444441" stroke-width="2" stroke-linejoin="round" marker-end="url(#m444441)"/>
<text x="342.0" y="570.0" font-size="11" text-anchor="start" font-weight="normal" fill="#6b6a64">state</text>
