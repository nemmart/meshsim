<text x="24.0" y="56.0" font-size="12.5" text-anchor="start" font-weight="normal" fill="#6b6a64">Tile T1 after the two all-to-alls. Key i and value i landed at position i of two buffers, so after the second sort each</text>
<text x="24.0" y="74.0" font-size="12.5" text-anchor="start" font-weight="normal" fill="#6b6a64">key's ordinal says where its value is, and a gather fetches the values in key order. (val a4: the value of T0's input record 4.)</text>
