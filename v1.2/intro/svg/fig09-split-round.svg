<text x="342.0" y="446.0" font-size="12" text-anchor="start" font-weight="normal" fill="#444441">lb: keys below the probe; ub: keys up to it.</text>
<text x="342.0" y="461.8" font-size="12" text-anchor="start" font-weight="normal" fill="#444441">Each is a binary search of the tile's run, inside</text>
<text x="342.0" y="477.7" font-size="12" text-anchor="start" font-weight="normal" fill="#444441">the bracket it keeps for that owner. Each tile</text>
<text x="342.0" y="493.5" font-size="12" text-anchor="start" font-weight="normal" fill="#444441">sends (lb, ub) to each owner as one 64-bit</text>
<text x="342.0" y="509.4" font-size="12" text-anchor="start" font-weight="normal" fill="#444441">packet (mode 5).</text>
<rect x="640.0" y="142.0" width="264.0" height="112.0" rx="6" fill="#FAECE7" stroke="#D85A30" stroke-width="1.1"/>
<text x="652.0" y="164.0" font-size="12.5" text-anchor="start" font-weight="bold" fill="#444441">T1: rank 8, probe 26</text>
<text x="652.0" y="184.0" font-size="12" text-anchor="start" font-weight="normal" fill="#444441">below L = 7, up to U = 8</text>
<text x="652.0" y="204.0" font-size="12" text-anchor="start" font-weight="normal" fill="#444441">U ≤ 8: higher; the bracket is now [27, 27]:</text>
<text x="652.0" y="221.0" font-size="12" text-anchor="start" font-weight="normal" fill="#444441">one key, and the 8 keys up to 26 fill rank 8</text>
<text x="652.0" y="241.0" font-size="12" text-anchor="start" font-weight="bold" fill="#444441">cuts = ub at 26: 3, 2, 1, 2</text>
<rect x="640.0" y="266.0" width="264.0" height="112.0" rx="6" fill="#E1F5EE" stroke="#1D9E75" stroke-width="1.1"/>
<text x="652.0" y="288.0" font-size="12.5" text-anchor="start" font-weight="bold" fill="#444441">T2: rank 16, probe 42</text>
<text x="652.0" y="308.0" font-size="12" text-anchor="start" font-weight="normal" fill="#444441">below L = 12, up to U = 17</text>
<text x="652.0" y="328.0" font-size="12" text-anchor="start" font-weight="normal" fill="#444441">L &lt; 16 &lt; U: inside the 5 42s; the first</text>
<text x="652.0" y="345.0" font-size="12" text-anchor="start" font-weight="normal" fill="#444441">4 stay below, in tile order: 2, 1, 1, 0</text>
<text x="652.0" y="365.0" font-size="12" text-anchor="start" font-weight="bold" fill="#444441">cuts = lb + taken: 6, 4, 3, 3</text>
<rect x="640.0" y="390.0" width="264.0" height="76.0" rx="6" fill="#EEEDFE" stroke="#7F77DD" stroke-width="1.1"/>
<text x="652.0" y="412.0" font-size="12.5" text-anchor="start" font-weight="bold" fill="#444441">T3: rank 24</text>
<text x="652.0" y="432.0" font-size="12" text-anchor="start" font-weight="normal" fill="#444441">found in round 1: 24 keys below 71</text>
<text x="652.0" y="452.0" font-size="12" text-anchor="start" font-weight="bold" fill="#444441">cuts: 7, 6, 5, 6</text>
<text x="24.0" y="548.0" font-size="12.5" text-anchor="start" font-weight="normal" fill="#444441">After the last round each owner sends every tile its cut (mode 7), so each tile knows how many of its records go to each owner.</text>
<text x="24.0" y="564.5" font-size="12.5" text-anchor="start" font-weight="normal" fill="#444441">Simplified: the rules for a bracket of one key and for equal keys are in sort/split/split.c.</text>
