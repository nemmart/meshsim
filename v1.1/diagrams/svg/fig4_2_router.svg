<line x1="24" y1="1077" x2="1276" y2="1077" stroke="#B4B2A9" stroke-width="0.8"/>
<text x="24.0" y="1099.0" font-size="12.5" text-anchor="start" font-weight="normal" fill="#444441">Each route block forwards an arriving packet in one cycle to output FIFOs, one FIFO per feeder; each output's round-robin selector sends one packet</text>
<text x="24.0" y="1115.0" font-size="12.5" text-anchor="start" font-weight="normal" fill="#444441">per cycle. Routes go horizontal first, then vertical, so to-right and to-left have two feeders each, to-up and to-down four, and eject five: 17 FIFOs.</text>
<text x="24.0" y="1131.0" font-size="11" text-anchor="start" font-weight="normal" fill="#6b6a64" font-style="italic">Source: spec/machine-spec.md v1.0, §4.6, §4.7.</text>
