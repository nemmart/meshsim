<text x="240.0" y="363.8" font-size="13" text-anchor="middle" font-weight="bold" fill="#444441">DMA write engine (§4.9)</text>
<text x="240.0" y="381.3" font-size="11" text-anchor="middle" font-weight="normal" fill="#444441">modes 2, 4: at PTR[src];  mode 3: at PTR[bucket digit];  then += 2</text>
<text x="240.0" y="395.9" font-size="11" text-anchor="middle" font-weight="normal" fill="#444441">mode 4: high 32 bits ← ordinal from DMA_RECORD_BASE_ADDRESS</text>
<text x="240.0" y="410.4" font-size="11" text-anchor="middle" font-weight="normal" fill="#444441">count-on-arrival: HIST[histogram digit] += 1</text>
<rect x="690.0" y="330.0" width="316.0" height="104.0" rx="6" fill="#E1F5EE" stroke="#1D9E75" stroke-width="1"/>
<text x="848.0" y="363.8" font-size="13" text-anchor="middle" font-weight="bold" fill="#444441">address generator (§4.2)</text>
<text x="848.0" y="381.3" font-size="11" text-anchor="middle" font-weight="normal" fill="#444441">walks STREAM (stream runs) or</text>
<text x="848.0" y="395.9" font-size="11" text-anchor="middle" font-weight="normal" fill="#444441">GROUP (group runs);</text>
<text x="848.0" y="410.4" font-size="11" text-anchor="middle" font-weight="normal" fill="#444441">one request per visit (figure 6.1)</text>
<rect x="480.0" y="330.0" width="180.0" height="104.0" rx="6" fill="#E1F5EE" stroke="#1D9E75" stroke-width="1"/>
<text x="570.0" y="363.7" font-size="12.5" text-anchor="middle" font-weight="bold" fill="#444441">controller read port (§4.3)</text>
<text x="570.0" y="380.5" font-size="11" text-anchor="middle" font-weight="normal" fill="#444441">≥ 64-entry request queue;</text>
<text x="570.0" y="395.1" font-size="11" text-anchor="middle" font-weight="normal" fill="#444441">32-bit reads queued by</text>
<text x="570.0" y="409.6" font-size="11" text-anchor="middle" font-weight="normal" fill="#444441">the controller's stores</text>
