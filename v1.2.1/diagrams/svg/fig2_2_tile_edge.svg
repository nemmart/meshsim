<text x="336.0" y="684.5" font-size="10.5" text-anchor="start" font-weight="normal" fill="#444441">balanced: the same cycle on every tile</text>
<rect x="620.0" y="670.0" width="650.0" height="21.0" rx="0" fill="white" stroke="#888780" stroke-width="0.8"/>
<text x="626.0" y="684.5" font-size="10.5" text-anchor="start" font-weight="normal" fill="#444441">go_q: a pulse at t wakes a waiting WFI at t + 1</text>
