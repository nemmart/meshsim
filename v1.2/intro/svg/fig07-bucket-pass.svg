<svg xmlns="http://www.w3.org/2000/svg" width="940" height="470" viewBox="0 0 940 470" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif">
<defs></defs>
<rect width="940" height="470" fill="white"/>
<text x="24.0" y="34.0" font-size="18" text-anchor="start" font-weight="bold" fill="#444441">Figure 7. One bucket pass on the tile</text>
<text x="24.0" y="56.0" font-size="12.5" text-anchor="start" font-weight="normal" fill="#6b6a64">The records stream out of one buffer, loop back into the tile, and land in another, bucketed by digit d through PTR,</text>
<text x="24.0" y="74.0" font-size="12.5" text-anchor="start" font-weight="normal" fill="#6b6a64">while HIST counts digit d + 1 for the next pass. Before the pass, the controller turns the counts into bucket starts.</text>
<rect x="24.0" y="110.0" width="190.0" height="300.0" rx="8" fill="#F1EFE8" stroke="#888780" stroke-width="1"/>
<text x="119.0" y="132.0" font-size="13.5" text-anchor="middle" font-weight="bold" fill="#444441">big SRAM</text>
<rect x="44.0" y="150.0" width="150.0" height="92.0" rx="6" fill="white" stroke="#888780" stroke-width="1"/>
<text x="119.0" y="183.7" font-size="13" text-anchor="middle" font-weight="bold" fill="#444441">buffer A</text>
<text x="119.0" y="201.3" font-size="12" text-anchor="middle" font-weight="normal" fill="#444441">records (key, ordinal),</text>
<text x="119.0" y="217.1" font-size="12" text-anchor="middle" font-weight="normal" fill="#444441">sorted by digits &lt; d</text>
<rect x="44.0" y="290.0" width="150.0" height="100.0" rx="6" fill="white" stroke="#888780" stroke-width="1"/>
<text x="119.0" y="319.8" font-size="13" text-anchor="middle" font-weight="bold" fill="#444441">buffer B</text>
<text x="119.0" y="337.4" font-size="12" text-anchor="middle" font-weight="normal" fill="#444441">256 buckets, filled</text>
<text x="119.0" y="353.2" font-size="12" text-anchor="middle" font-weight="normal" fill="#444441">at PTR[0] … PTR[255]</text>
<text x="119.0" y="369.0" font-size="12" text-anchor="middle" font-weight="normal" fill="#444441"> </text>
<rect x="56.0" y="360.0" width="18.0" height="18.0" rx="2" fill="white" stroke="#3B6EA5" stroke-width="0.9"/>
<rect x="77.5" y="360.0" width="18.0" height="18.0" rx="2" fill="white" stroke="#3B6EA5" stroke-width="0.9"/>
<rect x="99.0" y="360.0" width="18.0" height="18.0" rx="2" fill="white" stroke="#3B6EA5" stroke-width="0.9"/>
<rect x="120.5" y="360.0" width="18.0" height="18.0" rx="2" fill="white" stroke="#3B6EA5" stroke-width="0.9"/>
<rect x="142.0" y="360.0" width="18.0" height="18.0" rx="2" fill="white" stroke="#3B6EA5" stroke-width="0.9"/>
<rect x="163.5" y="360.0" width="18.0" height="18.0" rx="2" fill="white" stroke="#3B6EA5" stroke-width="0.9"/>
<text x="119.0" y="352.0" font-size="1" text-anchor="middle" font-weight="normal" fill="#444441"></text>
<rect x="270.0" y="150.0" width="170.0" height="92.0" rx="6" fill="#E1F5EE" stroke="#1D9E75" stroke-width="1"/>
<text x="355.0" y="183.7" font-size="13" text-anchor="middle" font-weight="bold" fill="#444441">address generator</text>
<text x="355.0" y="201.3" font-size="12" text-anchor="middle" font-weight="normal" fill="#444441">a stream run to the tile</text>
<text x="355.0" y="217.1" font-size="12" text-anchor="middle" font-weight="normal" fill="#444441">itself, mode 3, 64 bits</text>
<polygon points="268.0,196.0 259.6,200.2 259.6,191.8" fill="#1D9E75"/>
<polyline points="194.0,196.0 259.6,196.0" fill="none" stroke="#1D9E75" stroke-width="1.8" stroke-linejoin="round"/>
<text x="231.0" y="188.0" font-size="11.5" text-anchor="middle" font-weight="normal" fill="#1D9E75">reads</text>
<rect x="490.0" y="150.0" width="150.0" height="92.0" rx="6" fill="#F1EFE8" stroke="#888780" stroke-width="1"/>
<text x="565.0" y="183.7" font-size="13" text-anchor="middle" font-weight="bold" fill="#444441">loopback</text>
<text x="565.0" y="201.3" font-size="12" text-anchor="middle" font-weight="normal" fill="#444441">injection → router →</text>
<text x="565.0" y="217.1" font-size="12" text-anchor="middle" font-weight="normal" fill="#444441">traffic director</text>
<polygon points="488.0,196.0 479.9,200.0 479.9,192.0" fill="#444441"/>
<polyline points="440.0,196.0 479.9,196.0" fill="none" stroke="#444441" stroke-width="1.6" stroke-linejoin="round"/>
<text x="464.0" y="188.0" font-size="11.5" text-anchor="middle" font-weight="normal" fill="#6b6a64">pkt</text>
<rect x="490.0" y="290.0" width="150.0" height="100.0" rx="6" fill="#E3ECF6" stroke="#3B6EA5" stroke-width="1"/>
<text x="565.0" y="319.8" font-size="13" text-anchor="middle" font-weight="bold" fill="#444441">write engine</text>
<text x="565.0" y="337.4" font-size="12" text-anchor="middle" font-weight="normal" fill="#444441">t = digit d of the key</text>
<text x="565.0" y="353.2" font-size="12" text-anchor="middle" font-weight="normal" fill="#444441">write at PTR[t]</text>
<text x="565.0" y="369.0" font-size="12" text-anchor="middle" font-weight="normal" fill="#444441">PTR[t] += 2</text>
<polygon points="565.0,288.0 561.0,279.9 569.0,279.9" fill="#444441"/>
<polyline points="565.0,242.0 565.0,279.9" fill="none" stroke="#444441" stroke-width="1.6" stroke-linejoin="round"/>
<polygon points="196.0,340.0 204.4,335.8 204.4,344.2" fill="#3B6EA5"/>
<polyline points="488.0,340.0 204.4,340.0" fill="none" stroke="#3B6EA5" stroke-width="1.8" stroke-linejoin="round"/>
<text x="330.0" y="332.0" font-size="11.5" text-anchor="middle" font-weight="normal" fill="#3B6EA5">writes the record (64 bits)</text>
<rect x="700.0" y="270.0" width="210.0" height="50.0" rx="6" fill="#EEEDFE" stroke="#7F77DD" stroke-width="1"/>
<text x="805.0" y="290.8" font-size="12.5" text-anchor="middle" font-weight="bold" fill="#444441">PTR[0..255]</text>
<text x="805.0" y="307.7" font-size="11.5" text-anchor="middle" font-weight="normal" fill="#444441">bucket starts (chunk addresses)</text>
<rect x="700.0" y="350.0" width="210.0" height="50.0" rx="6" fill="#EEEDFE" stroke="#7F77DD" stroke-width="1"/>
<text x="805.0" y="370.8" font-size="12.5" text-anchor="middle" font-weight="bold" fill="#444441">HIST[0..255]</text>
<text x="805.0" y="387.7" font-size="11.5" text-anchor="middle" font-weight="normal" fill="#444441">counts of digit d + 1 (cleared first)</text>
<polygon points="698.0,298.0 690.8,302.8 689.9,295.1" fill="#7F77DD"/>
<polygon points="640.0,305.0 647.2,300.2 648.1,307.9" fill="#7F77DD"/>
<polyline points="647.7,304.1 690.3,298.9" fill="none" stroke="#7F77DD" stroke-width="1.4" stroke-linejoin="round"/>
<polygon points="698.0,372.0 689.6,374.2 691.2,366.7" fill="#7F77DD"/>
<polyline points="640.0,360.0 690.4,370.4" fill="none" stroke="#7F77DD" stroke-width="1.4" stroke-linejoin="round"/>
<text x="668.0" y="384.0" font-size="12" text-anchor="middle" font-weight="bold" fill="#7F77DD">+1</text>
<text x="668.0" y="293.0" font-size="12" text-anchor="middle" font-weight="bold" fill="#7F77DD">+2</text>
<rect x="700.0" y="110.0" width="210.0" height="132.0" rx="6" fill="#EEEDFE" stroke="#7F77DD" stroke-width="1"/>
<text x="805.0" y="132.0" font-size="13" text-anchor="middle" font-weight="bold" fill="#444441">controller, before the pass</text>
<text x="714.0" y="156.0" font-size="12" text-anchor="start" font-weight="normal" fill="#444441">for each digit value t = 0 … 255:</text>
<text x="728.0" y="176.0" font-size="12" text-anchor="start" font-weight="normal" fill="#444441">PTR[t] = B + 2 × (records</text>
<text x="746.0" y="194.0" font-size="12" text-anchor="start" font-weight="normal" fill="#444441">with digit d below t)</text>
<text x="728.0" y="214.0" font-size="12" text-anchor="start" font-weight="normal" fill="#444441">HIST[t] = 0</text>
<text x="714.0" y="234.0" font-size="11.5" text-anchor="start" font-weight="normal" fill="#6b6a64">(the exclusive prefix sum)</text>
<polygon points="805.0,268.0 801.1,260.3 808.9,260.3" fill="#7F77DD"/>
<polyline points="805.0,242.0 805.0,260.3" fill="none" stroke="#7F77DD" stroke-width="1.4" stroke-linejoin="round" stroke-dasharray="4 3"/>
<text x="812.0" y="260.0" font-size="11" text-anchor="start" font-weight="normal" fill="#7F77DD">sets</text>
<polygon points="912.0,236.0 919.6,240.1 913.3,244.5" fill="#7F77DD"/>
<path d="M912,372 C936,350 936,270 912,236" fill="none" stroke="#7F77DD" stroke-width="1.4" stroke-dasharray="4 3"/>
<text x="24.0" y="428.0" font-size="12.5" text-anchor="start" font-weight="normal" fill="#444441">Both table updates take one cycle per record, so a pass moves about one record per cycle. DMA_CONFIG names the two digits:</text>
<text x="24.0" y="444.5" font-size="12.5" text-anchor="start" font-weight="normal" fill="#444441">the bucket digit (d) and the histogram digit (d + 1; 0 on the last pass). Simplified; see spec 4.9, 4.10 and sw/RECIPES.md 4.</text>
</svg>