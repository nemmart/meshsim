<text x="24.0" y="34.0" font-size="18" text-anchor="start" font-weight="bold" fill="#444441">Figure 3. Augmenting: each record is stamped with the position it lands at</text>
<text x="24.0" y="56.0" font-size="12.5" text-anchor="start" font-weight="normal" fill="#6b6a64">Tile T1 in the keys all-to-all. Packets from different senders interleave; each lands at PTR[src], and the write engine</text>
<text x="24.0" y="74.0" font-size="12.5" text-anchor="start" font-weight="normal" fill="#6b6a64">replaces its high word by the ordinal, (landing address − DMA_RECORD_BASE_ADDRESS) / 2.</text>
