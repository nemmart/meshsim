<text x="336.0" y="563.5" font-size="10.5" text-anchor="start" font-weight="normal" fill="#444441">register decode (fig 3.2) → here</text>
<rect x="620.0" y="549.0" width="650.0" height="21.0" rx="0" fill="white" stroke="#888780" stroke-width="0.8"/>
<text x="626.0" y="563.5" font-size="10.5" text-anchor="start" font-weight="normal" fill="#444441">stores to SRAM_RD_ADDR_QUEUE and SRAM_RD_DEST_ADDR</text>
<rect x="30.0" y="570.0" width="200.0" height="21.0" rx="0" fill="white" stroke="#888780" stroke-width="0.8"/>
<text x="36.0" y="584.5" font-size="10.5" text-anchor="start" font-weight="bold" fill="#444441">free</text>
<rect x="230.0" y="570.0" width="100.0" height="21.0" rx="0" fill="white" stroke="#888780" stroke-width="0.8"/>
<text x="236.0" y="584.5" font-size="10.5" text-anchor="start" font-weight="normal" fill="#444441">7</text>
<rect x="330.0" y="570.0" width="290.0" height="21.0" rx="0" fill="white" stroke="#888780" stroke-width="0.8"/>
<text x="336.0" y="584.5" font-size="10.5" text-anchor="start" font-weight="normal" fill="#444441">here → register reads</text>
<rect x="620.0" y="570.0" width="650.0" height="21.0" rx="0" fill="white" stroke="#888780" stroke-width="0.8"/>
<text x="626.0" y="584.5" font-size="10.5" text-anchor="start" font-weight="normal" fill="#444441">a load of SRAM_RD_ADDR_QUEUE: free entries</text>
<rect x="30.0" y="591.0" width="200.0" height="21.0" rx="0" fill="white" stroke="#888780" stroke-width="0.8"/>
<text x="36.0" y="605.5" font-size="10.5" text-anchor="start" font-weight="bold" fill="#444441">valid_3, request</text>
<rect x="230.0" y="591.0" width="100.0" height="21.0" rx="0" fill="white" stroke="#888780" stroke-width="0.8"/>
<text x="236.0" y="605.5" font-size="10.5" text-anchor="start" font-weight="normal" fill="#444441">1, —</text>
<rect x="330.0" y="591.0" width="290.0" height="21.0" rx="0" fill="white" stroke="#888780" stroke-width="0.8"/>
<text x="336.0" y="605.5" font-size="10.5" text-anchor="start" font-weight="normal" fill="#444441">here → SRAM read queue (fig 7.2)</text>
<rect x="620.0" y="591.0" width="650.0" height="21.0" rx="0" fill="white" stroke="#888780" stroke-width="0.8"/>
<text x="626.0" y="605.5" font-size="10.5" text-anchor="start" font-weight="normal" fill="#444441">the head: chunk, width 32, mode 7, dst me, dest addr</text>
<rect x="30.0" y="612.0" width="200.0" height="21.0" rx="0" fill="white" stroke="#888780" stroke-width="0.8"/>
<text x="36.0" y="626.5" font-size="10.5" text-anchor="start" font-weight="bold" fill="#444441">taken_3</text>
<rect x="230.0" y="612.0" width="100.0" height="21.0" rx="0" fill="white" stroke="#888780" stroke-width="0.8"/>
<text x="236.0" y="626.5" font-size="10.5" text-anchor="start" font-weight="normal" fill="#444441">1</text>
<rect x="330.0" y="612.0" width="290.0" height="21.0" rx="0" fill="white" stroke="#888780" stroke-width="0.8"/>
<text x="336.0" y="626.5" font-size="10.5" text-anchor="start" font-weight="normal" fill="#444441">SRAM read queue → here</text>
<rect x="620.0" y="612.0" width="650.0" height="21.0" rx="0" fill="white" stroke="#888780" stroke-width="0.8"/>
<text x="626.0" y="626.5" font-size="10.5" text-anchor="start" font-weight="normal" fill="#444441">pop the head; in flight + 1</text>
<rect x="30.0" y="633.0" width="200.0" height="21.0" rx="0" fill="white" stroke="#888780" stroke-width="0.8"/>
<text x="36.0" y="647.5" font-size="10.5" text-anchor="start" font-weight="bold" fill="#444441">rp_inj</text>
<rect x="230.0" y="633.0" width="100.0" height="21.0" rx="0" fill="white" stroke="#888780" stroke-width="0.8"/>
<text x="236.0" y="647.5" font-size="10.5" text-anchor="start" font-weight="normal" fill="#444441">1</text>
<rect x="330.0" y="633.0" width="290.0" height="21.0" rx="0" fill="white" stroke="#888780" stroke-width="0.8"/>
<text x="336.0" y="647.5" font-size="10.5" text-anchor="start" font-weight="normal" fill="#444441">token FIFO (fig 7.3) → here</text>
<rect x="620.0" y="633.0" width="650.0" height="21.0" rx="0" fill="white" stroke="#888780" stroke-width="0.8"/>
<text x="626.0" y="647.5" font-size="10.5" text-anchor="start" font-weight="normal" fill="#444441">a read-port result was injected: in flight − 1</text>
<rect x="30.0" y="654.0" width="200.0" height="21.0" rx="0" fill="white" stroke="#888780" stroke-width="0.8"/>
<text x="36.0" y="668.5" font-size="10.5" text-anchor="start" font-weight="bold" fill="#444441">set[3]</text>
<rect x="230.0" y="654.0" width="100.0" height="21.0" rx="0" fill="white" stroke="#888780" stroke-width="0.8"/>
<text x="236.0" y="668.5" font-size="10.5" text-anchor="start" font-weight="normal" fill="#444441">1</text>
<rect x="330.0" y="654.0" width="290.0" height="21.0" rx="0" fill="white" stroke="#888780" stroke-width="0.8"/>
<text x="336.0" y="668.5" font-size="10.5" text-anchor="start" font-weight="normal" fill="#444441">here → TILE_CONDITIONS (fig 2.4)</text>
<rect x="620.0" y="654.0" width="650.0" height="21.0" rx="0" fill="white" stroke="#888780" stroke-width="0.8"/>
<text x="626.0" y="668.5" font-size="10.5" text-anchor="start" font-weight="normal" fill="#444441">a store with no free entry: the read is dropped</text>
<text x="30.0" y="701.0" font-size="11.5" text-anchor="start" font-weight="normal" fill="#444441">• The result is a mode-7 packet to the tile itself: addr[11:0] = dest, addr[19:12] = 0, payload[31:0] = the chunk, [63:32] = 0 (§4.3). It loops back through the router and lands through port B, counted by</text>
<text x="42.0" y="716.0" font-size="11.5" text-anchor="start" font-weight="normal" fill="#444441">DMA_REPLY_REMAINING (figure 5.1).</text>
<polyline points="30.0,749.0 70.0,749.0" fill="none" stroke="#7F77DD" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#m7F77DD)"/>
<text x="78.0" y="753.0" font-size="11.5" text-anchor="start" font-weight="normal" fill="#6b6a64">the controller's reads</text>
<polyline points="230.8,749.0 270.8,749.0" fill="none" stroke="#1D9E75" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#m1D9E75)"/>
<text x="278.8" y="753.0" font-size="11.5" text-anchor="start" font-weight="normal" fill="#6b6a64">counts</text>
<polyline points="342.2,749.0 382.2,749.0" fill="none" stroke="#D85A30" stroke-width="1.8" stroke-linejoin="round" stroke-dasharray="4 3" marker-end="url(#mD85A30)"/>
<text x="390.2" y="753.0" font-size="11.5" text-anchor="start" font-weight="normal" fill="#6b6a64">control</text>
<polyline points="459.3,749.0 499.3,749.0" fill="none" stroke="#C0392B" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#mC0392B)"/>
<text x="507.3" y="753.0" font-size="11.5" text-anchor="start" font-weight="normal" fill="#6b6a64">condition</text>
<line x1="24" y1="769" x2="1276" y2="769" stroke="#B4B2A9" stroke-width="0.8"/>
<text x="24.0" y="791.0" font-size="12.5" text-anchor="start" font-weight="normal" fill="#444441">A store to SRAM_RD_ADDR_QUEUE queues a 32-bit read with the current SRAM_RD_DEST_ADDR, which then advances. The queue drains into the SRAM</text>
<text x="24.0" y="807.0" font-size="12.5" text-anchor="start" font-weight="normal" fill="#444441">read queue at the lowest priority. An entry counts against the 64 until its result has been injected, so the free count a program reads</text>
<text x="24.0" y="823.0" font-size="12.5" text-anchor="start" font-weight="normal" fill="#444441">never overstates the room; a store with nothing free is dropped and sets condition 3.</text>
<text x="24.0" y="839.0" font-size="11" text-anchor="start" font-weight="normal" fill="#6b6a64" font-style="italic">Source: spec/machine-spec.md v1.0.</text>
