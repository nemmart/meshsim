<text x="783.0" y="247.0" font-size="11.5" text-anchor="middle" font-weight="normal" fill="#444441">group 13: next cycle (gap 0)</text>
<text x="24.0" y="326.0" font-size="13" text-anchor="start" font-weight="bold" fill="#444441">What the controller wrote for it (spec 4.2)</text>
<rect x="24.0" y="336.0" width="300.0" height="92.0" rx="5" fill="#EEEDFE" stroke="#7F77DD" stroke-width="1"/>
<text x="36.0" y="356.0" font-size="12" text-anchor="start" font-weight="bold" fill="#444441">GROUP[12]</text>
<text x="36.0" y="371.8" font-size="12" text-anchor="start" font-weight="normal" fill="#444441">R = the group's global maximum count</text>
<text x="36.0" y="387.7" font-size="12" text-anchor="start" font-weight="normal" fill="#444441">start stream = s, streams t = 4, gap = 0</text>
<text x="36.0" y="403.5" font-size="12" text-anchor="start" font-weight="normal" fill="#6b6a64">the R field is rewritten every all-to-all</text>
<rect x="340.0" y="336.0" width="576.0" height="92.0" rx="5" fill="#EEEDFE" stroke="#7F77DD" stroke-width="1"/>
<text x="352.0" y="356.0" font-size="12" text-anchor="start" font-weight="bold" fill="#444441">STREAM[s … s + 3], one per offset</text>
<text x="352.0" y="371.8" font-size="12" text-anchor="start" font-weight="normal" fill="#444441">source = the start of this tile's run for (me + d) mod 64, count = its length,</text>
<text x="352.0" y="387.7" font-size="12" text-anchor="start" font-weight="normal" fill="#444441">d = 14, 18, 46, 50 (relative, the same on every tile), mode 4 (keys) or 2 (values),</text>
<text x="352.0" y="403.5" font-size="12" text-anchor="start" font-weight="normal" fill="#444441">read size 64 bits (keys) or 128 bits (values: two packets per visit, period 8)</text>
<text x="24.0" y="454.0" font-size="12.5" text-anchor="start" font-weight="normal" fill="#444441">A rotation sends one element of each stream that still has one; a stream that has run out (+46 here) leaves its cycle idle. One</text>
<text x="24.0" y="470.5" font-size="12.5" text-anchor="start" font-weight="normal" fill="#444441">large stream anywhere therefore stretches its group on every tile: this is where skew costs (section 4). The whole all-to-all takes</text>
<text x="24.0" y="487.0" font-size="12.5" text-anchor="start" font-weight="normal" fill="#444441">Σ 4 × R_g cycles for the keys (8 × R_g for 128-bit values) plus a short start and tail.</text>
</svg>