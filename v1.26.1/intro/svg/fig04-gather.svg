<text x="378.0" y="444.0" font-size="12" text-anchor="middle" font-weight="normal" fill="#C99A06" font-style="italic">two of the eight lookups</text>
<text x="24.0" y="468.0" font-size="12.5" text-anchor="start" font-weight="normal" fill="#444441">The values all-to-all (mode 2) lands each sender's values at its own PTR[src], in the same order as its keys, so value i belongs to</text>
<text x="24.0" y="484.5" font-size="12.5" text-anchor="start" font-weight="normal" fill="#444441">key i. The gather streams the sorted (key, ordinal) records to the tile itself; for each, the GATHER engine reads k records at</text>
<text x="24.0" y="501.0" font-size="12.5" text-anchor="start" font-weight="normal" fill="#444441">V + 2k · ordinal (here V + 4 · ordinal) and writes them in order. Step 2 is the same operation on the input, before the split.</text>
