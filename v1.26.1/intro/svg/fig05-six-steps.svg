<svg xmlns="http://www.w3.org/2000/svg" width="940" height="360" viewBox="0 0 940 360" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif">
<defs></defs>
<rect width="940" height="360" fill="white"/>
<text x="24.0" y="34.0" font-size="18" text-anchor="start" font-weight="bold" fill="#444441">Figure 5. The six steps of the sort</text>
<text x="24.0" y="56.0" font-size="12.5" text-anchor="start" font-weight="normal" fill="#6b6a64">Steps 1, 2, 5 and 6 run inside each tile as streams from the tile to itself; steps 3 and 4 use the mesh. With 32-bit values</text>
<text x="24.0" y="74.0" font-size="12.5" text-anchor="start" font-weight="normal" fill="#6b6a64">the value rides in the record's high word, and steps 2 and 6 (dashed) drop out.</text>
<rect x="24.0" y="128.0" width="136.0" height="96.0" rx="6" fill="#F1EFE8" stroke="#888780" stroke-width="1"/>
<text x="92.0" y="152.8" font-size="13.5" text-anchor="middle" font-weight="bold" fill="#444441">1. Local sort</text>
<text x="92.0" y="171.0" font-size="12" text-anchor="middle" font-weight="normal" fill="#444441">keys in by augmenting</text>
<text x="92.0" y="186.9" font-size="12" text-anchor="middle" font-weight="normal" fill="#444441">(mode 4), then 4 bucket</text>
<text x="92.0" y="202.7" font-size="12" text-anchor="middle" font-weight="normal" fill="#444441">passes (mode 3)</text>
<rect x="34.0" y="242.0" width="116.0" height="44.0" rx="4" fill="white" stroke="#7F77DD" stroke-width="1"/>
<text x="92.0" y="260.0" font-size="11.5" text-anchor="middle" font-weight="normal" fill="#7F77DD">HIST, PTR,</text>
<text x="92.0" y="276.0" font-size="11.5" text-anchor="middle" font-weight="normal" fill="#7F77DD">write engine</text>
<polyline points="92.0,224.0 92.0,242.0" fill="none" stroke="#7F77DD" stroke-width="1" stroke-linejoin="round"/>
<polygon points="172.8,176.0 164.7,180.0 164.7,172.0" fill="#444441"/>
<polyline points="162.0,176.0 164.7,176.0" fill="none" stroke="#444441" stroke-width="1.6" stroke-linejoin="round"/>
<rect x="174.8" y="128.0" width="136.0" height="96.0" rx="6" fill="#F1EFE8" stroke="#888780" stroke-width="1" stroke-dasharray="6 4"/>
<text x="242.8" y="152.8" font-size="13.5" text-anchor="middle" font-weight="bold" fill="#444441">2. Gather</text>
<text x="242.8" y="171.0" font-size="12" text-anchor="middle" font-weight="normal" fill="#444441">values into key</text>
<text x="242.8" y="186.9" font-size="12" text-anchor="middle" font-weight="normal" fill="#444441">order by ordinal</text>
<text x="242.8" y="202.7" font-size="12" text-anchor="middle" font-weight="normal" fill="#444441">(mode 1)</text>
<rect x="184.8" y="242.0" width="116.0" height="44.0" rx="4" fill="white" stroke="#7F77DD" stroke-width="1" stroke-dasharray="6 4"/>
<text x="242.8" y="260.0" font-size="11.5" text-anchor="middle" font-weight="normal" fill="#7F77DD">GATHER</text>
<text x="242.8" y="276.0" font-size="11.5" text-anchor="middle" font-weight="normal" fill="#7F77DD">engine</text>
<polyline points="242.8,224.0 242.8,242.0" fill="none" stroke="#7F77DD" stroke-width="1" stroke-linejoin="round"/>
<polygon points="323.6,176.0 315.5,180.0 315.5,172.0" fill="#444441"/>
<polyline points="312.8,176.0 315.5,176.0" fill="none" stroke="#444441" stroke-width="1.6" stroke-linejoin="round"/>
<rect x="325.6" y="128.0" width="136.0" height="96.0" rx="6" fill="#FAEEDA" stroke="#B5651D" stroke-width="1"/>
<text x="393.6" y="152.8" font-size="13.5" text-anchor="middle" font-weight="bold" fill="#444441">3. Split</text>
<text x="393.6" y="171.0" font-size="12" text-anchor="middle" font-weight="normal" fill="#444441">bisection on key</text>
<text x="393.6" y="186.9" font-size="12" text-anchor="middle" font-weight="normal" fill="#444441">values: 63 searches</text>
<text x="393.6" y="202.7" font-size="12" text-anchor="middle" font-weight="normal" fill="#444441">in lockstep</text>
<rect x="335.6" y="242.0" width="116.0" height="44.0" rx="4" fill="white" stroke="#7F77DD" stroke-width="1"/>
<text x="393.6" y="260.0" font-size="11.5" text-anchor="middle" font-weight="normal" fill="#7F77DD">controller</text>
<text x="393.6" y="276.0" font-size="11.5" text-anchor="middle" font-weight="normal" fill="#7F77DD">read port</text>
<polyline points="393.6,224.0 393.6,242.0" fill="none" stroke="#7F77DD" stroke-width="1" stroke-linejoin="round"/>
<polygon points="474.4,176.0 466.3,180.0 466.3,172.0" fill="#444441"/>
<polyline points="463.6,176.0 466.3,176.0" fill="none" stroke="#444441" stroke-width="1.6" stroke-linejoin="round"/>
<rect x="476.4" y="128.0" width="136.0" height="96.0" rx="6" fill="#FAEEDA" stroke="#B5651D" stroke-width="1"/>
<text x="544.4" y="152.8" font-size="13.5" text-anchor="middle" font-weight="bold" fill="#444441">4. All-to-alls</text>
<text x="544.4" y="171.0" font-size="12" text-anchor="middle" font-weight="normal" fill="#444441">keys (mode 4) and</text>
<text x="544.4" y="186.9" font-size="12" text-anchor="middle" font-weight="normal" fill="#444441">values (mode 2), on</text>
<text x="544.4" y="202.7" font-size="12" text-anchor="middle" font-weight="normal" fill="#444441">the 16-group schedule</text>
<rect x="486.4" y="242.0" width="116.0" height="44.0" rx="4" fill="white" stroke="#7F77DD" stroke-width="1"/>
<text x="544.4" y="260.0" font-size="11.5" text-anchor="middle" font-weight="normal" fill="#7F77DD">group runs,</text>
<text x="544.4" y="276.0" font-size="11.5" text-anchor="middle" font-weight="normal" fill="#7F77DD">PTR[src]</text>
<polyline points="544.4,224.0 544.4,242.0" fill="none" stroke="#7F77DD" stroke-width="1" stroke-linejoin="round"/>
<polygon points="625.2,176.0 617.1,180.0 617.1,172.0" fill="#444441"/>
<polyline points="614.4,176.0 617.1,176.0" fill="none" stroke="#444441" stroke-width="1.6" stroke-linejoin="round"/>
<rect x="627.2" y="128.0" width="136.0" height="96.0" rx="6" fill="#F1EFE8" stroke="#888780" stroke-width="1"/>
<text x="695.2" y="152.8" font-size="13.5" text-anchor="middle" font-weight="bold" fill="#444441">5. Local sort</text>
<text x="695.2" y="171.0" font-size="12" text-anchor="middle" font-weight="normal" fill="#444441">4 bucket passes;</text>
<text x="695.2" y="186.9" font-size="12" text-anchor="middle" font-weight="normal" fill="#444441">digit 1 counted</text>
<text x="695.2" y="202.7" font-size="12" text-anchor="middle" font-weight="normal" fill="#444441">as keys arrived</text>
<rect x="637.2" y="242.0" width="116.0" height="44.0" rx="4" fill="white" stroke="#7F77DD" stroke-width="1"/>
<text x="695.2" y="260.0" font-size="11.5" text-anchor="middle" font-weight="normal" fill="#7F77DD">HIST, PTR,</text>
<text x="695.2" y="276.0" font-size="11.5" text-anchor="middle" font-weight="normal" fill="#7F77DD">write engine</text>
<polyline points="695.2,224.0 695.2,242.0" fill="none" stroke="#7F77DD" stroke-width="1" stroke-linejoin="round"/>
<polygon points="776.0,176.0 767.9,180.0 767.9,172.0" fill="#444441"/>
<polyline points="765.2,176.0 767.9,176.0" fill="none" stroke="#444441" stroke-width="1.6" stroke-linejoin="round"/>
<rect x="778.0" y="128.0" width="136.0" height="96.0" rx="6" fill="#F1EFE8" stroke="#888780" stroke-width="1" stroke-dasharray="6 4"/>
<text x="846.0" y="152.8" font-size="13.5" text-anchor="middle" font-weight="bold" fill="#444441">6. Gather</text>
<text x="846.0" y="171.0" font-size="12" text-anchor="middle" font-weight="normal" fill="#444441">values into final</text>
<text x="846.0" y="186.9" font-size="12" text-anchor="middle" font-weight="normal" fill="#444441">key order</text>
<text x="846.0" y="202.7" font-size="12" text-anchor="middle" font-weight="normal" fill="#444441">(mode 1)</text>
<rect x="788.0" y="242.0" width="116.0" height="44.0" rx="4" fill="white" stroke="#7F77DD" stroke-width="1" stroke-dasharray="6 4"/>
<text x="846.0" y="260.0" font-size="11.5" text-anchor="middle" font-weight="normal" fill="#7F77DD">GATHER</text>
<text x="846.0" y="276.0" font-size="11.5" text-anchor="middle" font-weight="normal" fill="#7F77DD">engine</text>
<polyline points="846.0,224.0 846.0,242.0" fill="none" stroke="#7F77DD" stroke-width="1" stroke-linejoin="round"/>
<rect x="24.0" y="92.0" width="286.8" height="18.0" rx="6" fill="white" stroke="white" stroke-width="0"/>
<text x="167.4" y="106.0" font-size="12" text-anchor="middle" font-weight="bold" fill="#6b6a64">inside each tile</text>
<text x="469.0" y="106.0" font-size="12" text-anchor="middle" font-weight="bold" fill="#B5651D">on the mesh</text>
<text x="770.6" y="106.0" font-size="12" text-anchor="middle" font-weight="bold" fill="#6b6a64">inside each tile</text>
<text x="24.0" y="316.0" font-size="12.5" text-anchor="start" font-weight="normal" fill="#444441">Purple: the units each step relies on. Each step is one or more phases; a phase ends when all 64 tiles have pulsed READY</text>
<text x="24.0" y="334.0" font-size="12.5" text-anchor="start" font-weight="normal" fill="#444441">to C&amp;C, which starts the next phase on every tile at once with GO (spec 6.3).</text>
</svg>