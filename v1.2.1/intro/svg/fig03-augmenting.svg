<text x="24.0" y="454.0" font-size="12.5" text-anchor="start" font-weight="normal" fill="#444441">The ordinal counts positions in the buffer, not arrivals: the 39 from T2 arrives second but lands at position 5, the start</text>
<text x="24.0" y="470.5" font-size="12.5" text-anchor="start" font-weight="normal" fill="#444441">of T2's run. Each sender's run is contiguous, so key i and a value that lands at position i of a matching buffer belong together.</text>
