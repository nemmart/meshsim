<polyline points="106.0,624.0 30.0,624.0" fill="none" stroke="#D85A30" stroke-width="2" stroke-linejoin="round" stroke-dasharray="4 3" marker-end="url(#mD85A30)"/>
<text x="100.0" y="600.0" font-size="11" text-anchor="end" font-weight="normal" fill="#D85A30">credits, to</text>
<text x="100.0" y="614.5" font-size="11" text-anchor="end" font-weight="normal" fill="#D85A30">Ingress/Egress</text>
<line x1="24" y1="732" x2="1352" y2="732" stroke="#B4B2A9" stroke-width="0.8"/>
<text x="24.0" y="754.0" font-size="12.5" text-anchor="start" font-weight="normal" fill="#444441">The bus driver is the only station on the AXI bus to the memory controller. The left bus is as wide as AXI and carries data only, between the bus driver and its consumers: pages and half pages for the</text>
<text x="24.0" y="770.0" font-size="12.5" text-anchor="start" font-weight="normal" fill="#444441">Updater, the RW engine and the Binder, and lines for the cache. Those three ask the cache where a file's pages are, and change the file's index, over the narrow look-up bus.</text>
<text x="24.0" y="786.0" font-size="12.5" text-anchor="start" font-weight="normal" fill="#444441">The right bus is the Tracer's fill bus, between the cache and the Tracer's three stations: its data cache, its instruction cache and its jump-table read (figure 9.1). The</text>
<text x="24.0" y="802.0" font-size="12.5" text-anchor="start" font-weight="normal" fill="#444441">peripheral bus fills the segment queue and the free page queue, writes the Updater's state and goes into the RW engine; the segment queue sends credits to Ingress/Egress. The LRU turns the segment</text>
<text x="24.0" y="818.0" font-size="12.5" text-anchor="start" font-weight="normal" fill="#444441">data into addresses and values, with a type for each: words, a half page (2 KB) or a full page (4 KB). The RW engine sends its packets through C&amp;C 2's +8 router input.</text>
<text x="24.0" y="834.0" font-size="11" text-anchor="start" font-weight="normal" fill="#6b6a64" font-style="italic">Source: v1.4_wip/planning/DESIGN-NOTES-2026-11-15.md, sections 2 to 4; the Tracer's stations are figure 9.1's.</text>
</svg>