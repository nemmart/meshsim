<text x="788.0" y="499.0" font-size="11.5" text-anchor="middle" font-weight="bold" fill="#1D9E75">3</text>
<text x="848.0" y="499.0" font-size="11.5" text-anchor="middle" font-weight="bold" fill="#1D9E75">2</text>
<text x="908.0" y="499.0" font-size="11.5" text-anchor="middle" font-weight="bold" fill="#1D9E75">1</text>
<text x="748.0" y="496.0" font-size="11" text-anchor="end" font-weight="normal" fill="#1D9E75">SRAM read queue (§4.5): one request a cycle,</text>
<text x="748.0" y="510.0" font-size="11" text-anchor="end" font-weight="normal" fill="#1D9E75">fixed priority 1 &gt; 2 &gt; 3</text>
<rect x="40.0" y="600.0" width="1220.0" height="70.0" rx="8" fill="#F1EFE8" stroke="#888780" stroke-width="1.3"/>
<text x="650.0" y="628.0" font-size="13.5" text-anchor="middle" font-weight="bold" fill="#444441">big SRAM: 8 areas of 128 bits × 32K rows = 4 MB (figure 7.1)</text>
<text x="650.0" y="650.0" font-size="11.5" text-anchor="middle" font-weight="normal" fill="#6b6a64">the write engine is its only writer; the SRAM read queue is its only reader; the controller reads it only through the read port</text>
<polyline points="240.0,434.0 240.0,598.0" fill="none" stroke="#3B6EA5" stroke-width="2.2" stroke-linejoin="round" stroke-dasharray="9 3" marker-end="url(#m3B6EA5)"/>
<text x="248.0" y="566.0" font-size="11" text-anchor="start" font-weight="normal" fill="#3B6EA5">SRAM write queue</text>
<polyline points="848.0,530.0 848.0,598.0" fill="none" stroke="#1D9E75" stroke-width="2.2" stroke-linejoin="round" marker-end="url(#m1D9E75)"/>
<text x="856.0" y="572.0" font-size="11" text-anchor="start" font-weight="normal" fill="#1D9E75">read requests</text>
<polyline points="1246.0,598.0 1246.0,200.0" fill="none" stroke="#1D9E75" stroke-width="2.6" stroke-linejoin="round" marker-end="url(#m1D9E75)"/>
<text x="1238.0" y="452.0" font-size="11" text-anchor="end" font-weight="normal" fill="#1D9E75">read returns</text>
<text x="1238.0" y="466.0" font-size="11" text-anchor="end" font-weight="normal" fill="#1D9E75">become packets,</text>
<text x="1238.0" y="480.0" font-size="11" text-anchor="end" font-weight="normal" fill="#1D9E75">in request order;</text>
<text x="1238.0" y="494.0" font-size="11" text-anchor="end" font-weight="normal" fill="#1D9E75">a read-port result is</text>
<text x="1238.0" y="508.0" font-size="11" text-anchor="end" font-weight="normal" fill="#1D9E75">a mode-7 packet to</text>
<text x="1238.0" y="522.0" font-size="11" text-anchor="end" font-weight="normal" fill="#1D9E75">the tile itself</text>
<rect x="40.0" y="700.0" width="30.0" height="18.0" rx="4" fill="white" stroke="#7F77DD" stroke-width="1.3"/>
<text x="78.0" y="714.0" font-size="11.5" text-anchor="start" font-weight="normal" fill="#6b6a64">a table: its own memory, in the control island (figure 3.1, §4.10); every engine access crosses ts_engine_latency each way</text>
<rect x="40.0" y="724.0" width="30.0" height="18.0" rx="4" fill="#FAEEDA" stroke="#D85A30" stroke-width="1.3"/>
<text x="78.0" y="738.0" font-size="11.5" text-anchor="start" font-weight="normal" fill="#6b6a64">a register written by the controller: configuration registers between phases (static during a phase); the read port's at any time</text>
<polyline points="820.0,734.0 856.0,734.0" fill="none" stroke="#1D9E75" stroke-width="2.2" stroke-linejoin="round" marker-end="url(#m1D9E75)"/>
<text x="862.0" y="738.0" font-size="11.5" text-anchor="start" font-weight="normal" fill="#6b6a64">read</text>
<polyline points="910.0,734.0 946.0,734.0" fill="none" stroke="#3B6EA5" stroke-width="2.2" stroke-linejoin="round" stroke-dasharray="9 3" marker-end="url(#m3B6EA5)"/>
<text x="952.0" y="738.0" font-size="11.5" text-anchor="start" font-weight="normal" fill="#6b6a64">write</text>
<polyline points="1004.0,734.0 1040.0,734.0" fill="none" stroke="#7F77DD" stroke-width="2.2" stroke-linejoin="round" marker-end="url(#m7F77DD)"/>
<text x="1046.0" y="738.0" font-size="11.5" text-anchor="start" font-weight="normal" fill="#6b6a64">controller</text>
<text x="40.0" y="764.0" font-size="11.5" text-anchor="start" font-weight="normal" fill="#D85A30">Software rule (§4.3, invariant 14): no packet from outside the tile, other than C&amp;C's mode-6 command words, arrives while read-port results are outstanding.</text>
<text x="40.0" y="780.0" font-size="11.5" text-anchor="start" font-weight="normal" fill="#D85A30">The network has no flow control: the hardware tolerates only 15 results against a stream at one packet per cycle, or 32 per burst at half rate [meas: meshsim].</text>
</g>
<line x1="24" y1="844" x2="1276" y2="844" stroke="#B4B2A9" stroke-width="0.8"/>
<text x="24.0" y="866.0" font-size="12.5" text-anchor="start" font-weight="normal" fill="#444441">Packets enter through the traffic director and leave through the injection point. The GATHER engine, the address generator and the controller read port share one</text>
<text x="24.0" y="882.0" font-size="12.5" text-anchor="start" font-weight="normal" fill="#444441">SRAM read queue at fixed priority, drawn right to left from highest to lowest. Every read return becomes a packet: a read-port result is a mode-7 packet to the tile itself,</text>
<text x="24.0" y="898.0" font-size="12.5" text-anchor="start" font-weight="normal" fill="#444441">back through the loopback and the director. The write engine is the only writer.</text>
<text x="24.0" y="914.0" font-size="11" text-anchor="start" font-weight="normal" fill="#6b6a64" font-style="italic">Source: spec/machine-spec.md v1.0, §4.1–§4.10, §8, §12.</text>
</svg>