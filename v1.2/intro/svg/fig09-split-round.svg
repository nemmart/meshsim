<svg xmlns="http://www.w3.org/2000/svg" width="940" height="590" viewBox="0 0 940 590" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif">
<defs></defs>
<rect width="940" height="590" fill="white"/>
<text x="24.0" y="34.0" font-size="18" text-anchor="start" font-weight="bold" fill="#444441">Figure 9. Round 4 of the toy split, close up</text>
<text x="24.0" y="56.0" font-size="12.5" text-anchor="start" font-weight="normal" fill="#6b6a64">One round is two exchanges, each started on every tile at once: the probes out, then the counts back. Between them, every</text>
<text x="24.0" y="74.0" font-size="12.5" text-anchor="start" font-weight="normal" fill="#6b6a64">tile counts its own run against each new probe with binary searches through the controller read port.</text>
<rect x="24.0" y="96.0" width="288.0" height="424.0" rx="8" fill="white" stroke="#B4B2A9" stroke-width="1"/>
<text x="168.0" y="120.0" font-size="13.5" text-anchor="middle" font-weight="bold" fill="#444441">1. Owners send their probes</text>
<rect x="326.0" y="96.0" width="288.0" height="424.0" rx="8" fill="white" stroke="#B4B2A9" stroke-width="1"/>
<text x="470.0" y="120.0" font-size="13.5" text-anchor="middle" font-weight="bold" fill="#444441">2. Every tile counts</text>
<rect x="628.0" y="96.0" width="288.0" height="424.0" rx="8" fill="white" stroke="#B4B2A9" stroke-width="1"/>
<text x="772.0" y="120.0" font-size="13.5" text-anchor="middle" font-weight="bold" fill="#444441">3. Owners narrow or finish</text>
<rect x="38.0" y="146.0" width="260.0" height="42.0" rx="5" fill="#FAECE7" stroke="#D85A30" stroke-width="1.1"/>
<text x="50.0" y="163.0" font-size="12" text-anchor="start" font-weight="bold" fill="#444441">T1: bracket [25, 27]</text>
<text x="50.0" y="179.0" font-size="12" text-anchor="start" font-weight="normal" fill="#444441">probe = midpoint = 26</text>
<rect x="38.0" y="198.0" width="260.0" height="42.0" rx="5" fill="#E1F5EE" stroke="#1D9E75" stroke-width="1.1"/>
<text x="50.0" y="215.0" font-size="12" text-anchor="start" font-weight="bold" fill="#444441">T2: bracket [42, 42]</text>
<text x="50.0" y="231.0" font-size="12" text-anchor="start" font-weight="normal" fill="#444441">probe = midpoint = 42</text>
<rect x="38.0" y="250.0" width="260.0" height="42.0" rx="5" fill="#EEEDFE" stroke="#7F77DD" stroke-width="1.1"/>
<text x="50.0" y="267.0" font-size="12" text-anchor="start" font-weight="bold" fill="#444441">T3: done in round 1</text>
<text x="50.0" y="283.0" font-size="12" text-anchor="start" font-weight="normal" fill="#444441">sends 71 again: the done marker</text>
<text x="40.0" y="316.0" font-size="12" text-anchor="start" font-weight="normal" fill="#444441">Each owner sends its probe to every tile,</text>
<text x="40.0" y="331.8" font-size="12" text-anchor="start" font-weight="normal" fill="#444441">one word each (mode 7), in the 16-group</text>
<text x="40.0" y="347.7" font-size="12" text-anchor="start" font-weight="normal" fill="#444441">order, so every step is a permutation.</text>
<text x="40.0" y="363.5" font-size="12" text-anchor="start" font-weight="normal" fill="#444441"></text>
<text x="40.0" y="379.4" font-size="12" text-anchor="start" font-weight="normal" fill="#444441">A probe repeated from the last round</text>
<text x="40.0" y="395.2" font-size="12" text-anchor="start" font-weight="normal" fill="#444441">means done: tiles skip it. When every</text>
<text x="40.0" y="411.0" font-size="12" text-anchor="start" font-weight="normal" fill="#444441">owner is done, the rounds stop early.</text>
<text x="40.0" y="426.9" font-size="12" text-anchor="start" font-weight="normal" fill="#444441"></text>
<text x="40.0" y="442.7" font-size="12" text-anchor="start" font-weight="normal" fill="#444441">Tile 0 owns no boundary; on the machine</text>
<text x="40.0" y="458.6" font-size="12" text-anchor="start" font-weight="normal" fill="#444441">tiles 1–63 own boundaries 1–63.</text>
