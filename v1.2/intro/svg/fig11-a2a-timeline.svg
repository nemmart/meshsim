<text x="24.0" y="34.0" font-size="18" text-anchor="start" font-weight="bold" fill="#444441">Figure 11. One tile's keys all-to-all: 16 groups, run as one group run</text>
<text x="24.0" y="56.0" font-size="12.5" text-anchor="start" font-weight="normal" fill="#6b6a64">Every tile runs the same timetable, started on the same cycle; only the data differs. A group runs R rotations, R being its</text>
<text x="24.0" y="74.0" font-size="12.5" text-anchor="start" font-weight="normal" fill="#6b6a64">largest stream anywhere on the mesh, and the next group starts on the same cycle everywhere.</text>
<text x="24.0" y="110.0" font-size="12.5" text-anchor="start" font-weight="normal" fill="#444441">16 groups, one after another (uniform keys: R ≈ 1,110 in every group, ≈ 4,450 cycles each)</text>
